<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TKH Kebun V3</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: #f0f4f3; color: #243238; }
    .app { max-width: 520px; margin: auto; background: #ffffff; min-height: 100vh; padding-bottom: 30px; }
    .header { background: #164f45; color: white; padding: 20px; border-bottom-left-radius: 12px; border-bottom-right-radius: 12px; }
    .header .company { font-size: 12px; opacity: 0.9; text-transform: uppercase; }
    .header h1 { margin-top: 4px; font-size: 24px; }
    .sync-bar { margin: 12px; padding: 10px 14px; border-radius: 10px; background: #e5f5e9; color: #23633b; font-size: 13px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
    .sync-bar.offline { background: #fff4d8; color: #795b00; }
    .step-card { margin: 12px; padding: 16px; border: 1px solid #dce4e2; border-radius: 14px; background: #ffffff; }
    .step-title { font-size: 18px; font-weight: bold; color: #164f45; margin-bottom: 14px; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; }
    label { display: block; margin-top: 12px; margin-bottom: 4px; font-weight: bold; font-size: 14px; color: #526066; }
    input, select { width: 100%; padding: 12px; border: 1px solid #cbd5d2; border-radius: 8px; font-size: 15px; background: white; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn { border: none; border-radius: 10px; padding: 14px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 12px; }
    .btn-primary { background: #164f45; color: white; }
    .btn-secondary { background: #e4f1ee; color: #164f45; }
    .btn-danger { background: #f9e2e2; color: #b52e2e; padding: 8px 12px; font-size: 12px; width: auto; margin-top:8px;}
    .btn-row { display: flex; gap: 10px; margin-top: 16px; }
    .item-card { border: 1px solid #dce4e2; border-radius: 10px; padding: 12px; margin-top: 10px; background: #fafcfb; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="company">PT INDOARABICA MANGKURAJA</div>
    <h1>TKH Kebun V3</h1>
  </div>

  <div id="syncBar" class="sync-bar">
    <span id="syncText">● Online (Server V3)</span>
    <span id="queueBadge" onclick="clearQueue()" style="cursor: pointer; text-decoration: underline;" title="Ketuk untuk paksa reset antrean jika error">0 Antrean (Reset)</span>
  </div>

  <!-- STEP 1: INFO -->
  <div id="step1" class="step-card">
    <div class="step-title">1. Form Informasi Harian</div>
    <label>Tanggal</label><input type="date" id="tanggal">
    <label>Sektor</label>
    <select id="sektor">
      <option value="">-- Pilih --</option><option value="S001">Sektor 1</option><option value="S002">Sektor 2</option>
    </select>
    <label>Mandor</label>
    <select id="pic">
      <option value="">-- Pilih --</option><option value="PIC001">Wahyuni</option><option value="PIC002">Aroka</option><option value="PIC003">Suparso</option>
    </select>
    <button class="btn btn-primary" onclick="go(2)">Lanjut &gt;</button>
  </div>

  <!-- STEP 2: KEGIATAN -->
  <div id="step2" class="step-card hidden">
    <div class="step-title">2. Form Kegiatan</div>
    <label>Kegiatan</label>
    <select id="kegiatan">
      <option value="">-- Pilih --</option><option value="1">Pemupukan NPK (TBM)</option><option value="2">Pemupukan Urea (TBM)</option><option value="11">Babad / Babat Rumput Manual</option><option value="19">Panen Petik Merah</option>
    </select>
    
    <label>Bahan (Opsional)</label>
    <select id="bahanId"><option value="">-- Tanpa Bahan --</option><option value="B1">Pupuk NPK</option><option value="B2">Dexlite</option></select>
    <div class="row">
      <div><label>Jml</label><input type="number" id="bahanJml" placeholder="0"></div>
      <div><label>Sat</label><input type="text" id="bahanSat" placeholder="Kg/Lt"></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="go(1)">&lt; Kembali</button>
      <button class="btn btn-primary" onclick="go(3)">Lanjut &gt;</button>
    </div>
  </div>

  <!-- STEP 3: TKH -->
  <div id="step3" class="step-card hidden">
    <div class="step-title">3. Tenaga Kerja (TKH)</div>
    <div class="item-card">
      <label>Nama TKH</label>
      <select id="tkhId">
        <option value="">-- Pilih --</option><option value="T001">Anita</option><option value="T002">Ari Kristianto</option>
      </select>
      <div class="row">
        <div><label>Mulai</label><input type="time" id="jamM" value="07:30"></div>
        <div><label>Selesai</label><input type="time" id="jamS" value="11:00"></div>
      </div>
      <div class="row">
        <div><label>Blok</label><input type="text" id="blok" placeholder="C10"></div>
        <div><label>Hasil</label><input type="number" id="hasil" placeholder="Jml"></div>
      </div>
      <label>Satuan</label><select id="satuanKerja"><option value="Batang">Batang</option><option value="Kg">Kg</option></select>
      <button class="btn btn-secondary" onclick="addTkh()">+ Tambah Pekerja</button>
    </div>
    
    <div id="listTkh"></div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="go(2)">&lt; Kembali</button>
      <button class="btn btn-primary" onclick="go(4)">Preview &gt;</button>
    </div>
  </div>

  <!-- STEP 4: PREVIEW -->
  <div id="step4" class="step-card hidden">
    <div class="step-title">4. Simpan</div>
    <button class="btn btn-primary" style="background:#23633b;" onclick="saveData()">✔ SIMPAN SEKARANG</button>
    <button class="btn btn-secondary" onclick="go(3)">&lt; Batal / Edit</button>
  </div>
</div>

<script>
// =============== PERHATIAN: PASTE URL DEPLOYMENT BARU DI SINI ===============
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwL6NATZcHPja6S6cPpMulkYDki0GPAybRgCJgnyJm3JbnR3fbX0WCTZfQ0SVUMMDBI/exec';
// ==============================================================================

const QUEUE_KEY = 'TKH_V3_Q';
let draftTkh = [];
let isSyncing = false;

window.onload = function() {
  document.getElementById('tanggal').value = new Date().toISOString().substring(0,10);
  updateUI();
  if (navigator.onLine) runSync();
};

function go(step) {
  for(let i=1; i<=4; i++) document.getElementById('step'+i).classList.add('hidden');
  document.getElementById('step'+step).classList.remove('hidden');
}

function addTkh() {
  const sel = document.getElementById('tkhId');
  if(!sel.value) return alert('Pilih TKH');
  draftTkh.push({
    tkh: { id: sel.value, nama: sel.options[sel.selectedIndex].text },
    jamMulai: document.getElementById('jamM').value,
    jamSelesai: document.getElementById('jamS').value,
    blok: document.getElementById('blok').value,
    prestasi: document.getElementById('hasil').value,
    satuan: document.getElementById('satuanKerja').value
  });
  renderTkh();
}

function renderTkh() {
  const c = document.getElementById('listTkh');
  c.innerHTML = '';
  draftTkh.forEach((t, i) => {
    c.innerHTML += `<div class="item-card"><b>${t.tkh.nama}</b> (Blok ${t.blok}) - ${t.prestasi} ${t.satuan} <button class="btn-danger" onclick="draftTkh.splice(${i},1); renderTkh();">Hapus</button></div>`;
  });
}

function saveData() {
  if(!draftTkh.length) return alert('Belum ada TKH!');
  
  const selSek = document.getElementById('sektor');
  const selPic = document.getElementById('pic');
  const selKeg = document.getElementById('kegiatan');
  const selBah = document.getElementById('bahanId');

  const payload = {
    clientTransactionId: 'TX-' + Date.now(),
    tanggal: document.getElementById('tanggal').value,
    sektor: { id: selSek.value, nama: selSek.options[selSek.selectedIndex].text },
    pic: { id: selPic.value, nama: selPic.options[selPic.selectedIndex].text },
    kegiatan: { id: selKeg.value, nama: selKeg.options[selKeg.selectedIndex].text, satuan: draftTkh[0].satuan },
    tkhList: draftTkh,
    bahanList: selBah.value ? [{ id: selBah.value, nama: selBah.options[selBah.selectedIndex].text, jumlah: document.getElementById('bahanJml').value, satuan: document.getElementById('bahanSat').value }] : []
  };

  const q = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
  q.push(payload);
  localStorage.setItem(QUEUE_KEY, JSON.stringify(q));
  
  draftTkh = []; renderTkh(); go(1);
  alert('Data masuk antrean (memori HP).');
  updateUI();
  runSync();
}

// MESIN SINKRONISASI BYPASS CORS GET
function runSync() {
  const q = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
  if (!q.length || isSyncing) return;
  
  isSyncing = true;
  document.getElementById('syncText').textContent = '⏳ Mengirim ke Google Sheet...';
  
  const item = q[0];
  const url = SCRIPT_URL + "?payload=" + encodeURIComponent(JSON.stringify(item));

  fetch(url, { method: 'GET', mode: 'no-cors' })
  .then(() => {
    setTimeout(() => {
      const liveQ = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
      liveQ.shift(); // Buang yang berhasil
      localStorage.setItem(QUEUE_KEY, JSON.stringify(liveQ));
      isSyncing = false;
      updateUI();
      if(liveQ.length > 0) runSync();
    }, 1500); // Tunggu server nulis ke 3 sheet
  })
  .catch((err) => {
    isSyncing = false; updateUI();
  });
}

function updateUI() {
  const q = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
  document.getElementById('queueBadge').textContent = q.length + ' Antrean (Reset)';
  document.getElementById('syncText').textContent = navigator.onLine ? '● Online (Siap Kirim)' : '● Offline';
}

function clearQueue() {
  if(confirm('Kosongkan antrean? (Jika ada data yang tersangkut)')) {
    localStorage.removeItem(QUEUE_KEY);
    isSyncing = false;
    updateUI();
  }
}
</script>
</body>
</html>
