<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>TKH Kebun V2</title>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6f5;
      color: #243238;
    }
    .app {
      max-width: 560px;
      margin: auto;
      background: #ffffff;
      min-height: 100vh;
    }
    .header {
      background: #164f45;
      color: white;
      padding: 20px;
    }
    .header .company {
      font-size: 14px;
      opacity: .9;
    }
    .header h1 {
      margin: 5px 0 0;
      font-size: 26px;
    }
    .section {
      margin: 14px;
      padding: 16px;
      border: 1px solid #dce4e2;
      border-radius: 16px;
      background: white;
    }
    .section-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 14px;
      color: #164f45;
    }
    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-weight: bold;
      color: #526066;
      font-size: 14px;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5d2;
      border-radius: 10px;
      font-size: 15px;
      background: white;
    }
    textarea {
      min-height: 70px;
      resize: vertical;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .card {
      margin-top: 12px;
      padding: 14px;
      border: 1px solid #dce4e2;
      border-radius: 12px;
      background: #fafcfb;
    }
    .card-title {
      font-weight: bold;
      margin-bottom: 8px;
      color: #164f45;
    }
    .btn {
      border: none;
      border-radius: 10px;
      padding: 13px 16px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-add {
      background: #e4f1ee;
      color: #164f45;
      width: 100%;
      margin-top: 12px;
    }
    .btn-save {
      background: #164f45;
      color: white;
      width: 100%;
      font-size: 17px;
      margin-top: 10px;
    }
    .btn-delete {
      background: #f9e2e2;
      color: #b52e2e;
      padding: 8px 12px;
      font-size: 13px;
      margin-top: 10px;
    }
    .hidden { display: none !important; }
    .info {
      margin-top: 8px;
      padding: 10px;
      border-radius: 9px;
      background: #edf5f3;
      color: #31534c;
      font-size: 13px;
    }
    .summary {
      margin-top: 10px;
      padding: 12px;
      border-radius: 10px;
      background: #f5f7f6;
      font-size: 14px;
    }
    .activity-item {
      padding: 12px;
      border-bottom: 1px solid #e1e6e4;
    }
    .activity-item:last-child { border-bottom: none; }
    .activity-name {
      font-weight: bold;
      color: #164f45;
    }
    .small {
      font-size: 13px;
      color: #667278;
      margin-top: 3px;
    }
    .loading {
      text-align: center;
      padding: 24px;
      color: #68756f;
    }
    .success {
      background: #e5f5e9;
      color: #23633b;
      padding: 13px;
      border-radius: 10px;
      margin-top: 12px;
    }
    .error {
      background: #fae5e5;
      color: #a32d2d;
      padding: 13px;
      border-radius: 10px;
      margin-top: 12px;
    }

    .tkh-toolbar { position: relative; margin-top: 12px; margin-bottom: 10px; }
    .tkh-dropdown-button {
      width: 100%; display: flex; justify-content: space-between; align-items: center;
      padding: 13px; border: 1px solid #cbd5d2; border-radius: 10px; background: #fff;
      color: #243238; font-size: 15px; cursor: pointer;
    }
    .tkh-dropdown-panel {
      display: none; position: relative; margin-top: 6px; border: 1px solid #cbd5d2;
      border-radius: 10px; background: #fff; max-height: 250px; overflow-y: auto;
      box-shadow: 0 4px 12px rgba(0,0,0,.08);
    }
    .tkh-dropdown-panel.open { display: block; }
    .tkh-dropdown-actions {
      display: flex; gap: 8px; padding: 8px 10px; background: #f5f7f6;
      border-bottom: 1px solid #dce4e2; position: sticky; top: 0; z-index: 2;
    }
    .tkh-dropdown-actions button {
      flex: 1; border: 1px solid #cbd5d2; border-radius: 7px; padding: 7px;
      background: #fff; color: #164f45; font-size: 12px; font-weight: bold; cursor: pointer;
    }
    .tkh-select-row { border-bottom: 1px solid #edf0ef; background: #fff; }
    .tkh-check {
      display: grid; grid-template-columns: 20px 1fr auto; align-items: center;
      gap: 10px; margin: 0; padding: 10px 12px; cursor: pointer;
    }
    .tkh-check input { width: 18px; height: 18px; margin: 0; }
    .tkh-name { font-weight: bold; color: #243238; font-size: 14px; }
    .tkh-pw { font-size: 12px; color: #667278; }
    .selected-title { margin-top: 14px; margin-bottom: 6px; font-weight: bold; color: #164f45; font-size: 14px; }
    .tkh-prestasi-card { margin-top: 8px; background: #fafcfb; }
    .tkh-detail-head { display: flex; justify-content: space-between; align-items: flex-start; }
    .tkh-number { font-size: 12px; color: #667278; }
    .optional { font-weight: normal; color: #7b878c; }

    .sync-bar {
      margin: 10px 14px 0; padding: 10px 12px; border-radius: 10px;
      background: #f5f7f6; font-size: 13px; color: #526066;
    }
    .sync-bar strong { color: #164f45; }
    .sync-actions { display: flex; gap: 8px; margin-top: 8px; }
    .sync-actions button {
      flex: 1; border: 1px solid #cbd5d2; background: white; border-radius: 8px;
      padding: 7px; font-weight: bold; cursor: pointer;
    }
    .offline-note { background: #fff4d8; color: #795b00; }
    .pending-note { background: #eaf2ff; color: #24558a; }

    @media (max-width: 480px) {
      .section { margin: 10px; padding: 12px; }
      .row { grid-template-columns: 1fr; }
    }
  </style>

  <meta name="theme-color" content="#164f45">
  <meta name="mobile-web-app-capable" content="yes">
</head>

<body>

<div class="app">

  <div class="header">
    <div class="company">PT INDOARABICA MANGKURAJA</div>
    <h1>TKH Kebun</h1>
  </div>

  <div id="syncBar" class="sync-bar">
    <strong>Memeriksa koneksi...</strong>
  </div>

  <!-- SECTION 1 — KEGIATAN -->
  <div class="section">
    <div class="section-title">1. Kegiatan</div>

    <label>Tanggal</label>
    <input type="date" id="tanggal" onchange="loadToday()">

    <label>Sektor</label>
    <select id="sektor">
      <option value="">-- Pilih Sektor --</option>
    </select>

    <label>PIC / Mandor</label>
    <select id="pic">
      <option value="">-- Pilih PIC / Mandor --</option>
    </select>

    <label>Jenis Kegiatan</label>
    <select id="kegiatan" onchange="kegiatanChanged()">
      <option value="">-- Pilih Kegiatan --</option>
    </select>

    <div id="kegiatanLainBox" class="hidden">
      <label>Nama Kegiatan Baru</label>
      <input type="text" id="kegiatanLain" placeholder="Tuliskan nama kegiatan">

      <label>Satuan Prestasi Kegiatan Baru</label>
      <select id="satuanKegiatanLain" onchange="satuanLainChanged()">
        <option value="">-- Pilih Satuan --</option>
      </select>
    </div>

    <div class="row">
      <div>
        <label>Jam Mulai</label>
        <input type="time" id="jamAwal" value="07:30">
      </div>
      <div>
        <label>Jam Selesai</label>
        <input type="time" id="jamAkhir" value="11:00">
      </div>
    </div>

    <label>Satuan Prestasi</label>
    <select id="satuanPekerjaan" onchange="hitungTotalPrestasi()">
      <option value="">-- Pilih Satuan --</option>
    </select>

    <label>Blok</label>
    <input type="text" id="blokPekerjaan" placeholder="Contoh: A2, B32, C10, H5">

    <label>Keterangan Kegiatan</label>
    <textarea id="keteranganKegiatan" placeholder="Keterangan pekerjaan (opsional)"></textarea>
  </div>

  <!-- SECTION 2 — TENAGA KERJA HARIAN (TKH) -->
  <div class="section">
    <div class="section-title">2. Tenaga Kerja Harian (TKH)</div>
    <div class="info">Pilih TKH yang bertugas. Prestasi dicatat per individu sesuai satuan di atas.</div>

    <div class="tkh-toolbar">
      <button type="button" id="tkhDropdownButton" class="tkh-dropdown-button" aria-expanded="false" onclick="toggleTKHDropdown()">
        <span id="tkhDropdownLabel">Pilih nama TKH</span><span aria-hidden="true">▾</span>
      </button>
      <div id="tkhDropdownPanel" class="tkh-dropdown-panel"></div>
    </div>

    <div id="tkhContainer"></div>
    <div id="totalPrestasiBox" class="summary hidden"></div>
  </div>

  <!-- SECTION 3 — PEMAKAIAN BAHAN -->
  <div class="section">
    <div class="section-title">3. Pemakaian Bahan</div>
    <div id="bahanContainer"></div>
    <button class="btn btn-add" onclick="tambahBahan()">+ Tambah Bahan</button>
  </div>

  <!-- SIMPAN -->
  <div class="section">
    <button class="btn btn-save" onclick="simpanSemua()">SIMPAN KEGIATAN</button>
    <div id="message"></div>
  </div>

  <!-- KEGIATAN HARI INI -->
  <div class="section">
    <div class="section-title">Kegiatan Hari Ini</div>
    <div id="todayList" class="loading">Memuat data...</div>
  </div>

</div>

<script>
function backendCall(method, arg) {
  return new Promise(function(resolve, reject) {
    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      reject(new Error('Fungsi server hanya tersedia saat dibuka via Web App Google Apps Script.'));
      return;
    }
    const runner = google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(function(error) {
        reject(new Error(error && error.message ? error.message : String(error || 'Gagal tersambung ke server.')));
      });

    try {
      if (method === 'getMasterData') {
        runner.getMasterData();
      } else if (method === 'getAktivitasByDate') {
        runner.getAktivitasByDate(arg);
      } else if (method === 'saveFullActivity') {
        runner.saveFullActivity(arg);
      } else if (method === 'checkTKHOverlapBeforeSave') {
        runner.checkTKHOverlapBeforeSave(arg);
      } else {
        reject(new Error('Fungsi server tidak dikenali: ' + method));
      }
    } catch (error) {
      reject(error);
    }
  });
}

// Data Master Standar (Sinkron penuh dengan TKH_Kebun_V2.xlsx)
const DEFAULT_SATUAN_KEGIATAN = [
  'Batang', 'Tangki', 'Lubang', 'Ha', 'Meter', 'Unit', 'm3', 'Tanpa Satuan', 'Polibag', 'Kg'
];
const DEFAULT_SATUAN_BAHAN = [
  'Liter', 'Kg', 'Gram', 'Pcs', 'Sachet', 'ml'
];

let MASTER = {
  tkhs: [],
  kegiatan: [],
  bahan: [],
  sektor: [],
  pic: [],
  satuan: []
};

let bahanRows = [];

window.onload = function() {
  document.getElementById('tanggal').value = new Date().toISOString().substring(0, 10);
  setupOfflineSync();

  const cached = localStorage.getItem(OFFLINE_MASTER_KEY);
  if (!navigator.onLine && cached) {
    try {
      MASTER = JSON.parse(cached) || MASTER;
      initAllMasterViews();
      showMessage('Mode offline. Menggunakan cache data lokal perangkat.', false);
      return;
    } catch (e) {}
  }

  backendCall('getMasterData')
    .then(function(data) {
      if (data) {
        MASTER = data;
        localStorage.setItem(OFFLINE_MASTER_KEY, JSON.stringify(MASTER));
      }
      initAllMasterViews();
      syncQueueSequentially();
    })
    .catch(function(error) {
      const cachedBackup = localStorage.getItem(OFFLINE_MASTER_KEY);
      if (cachedBackup) {
        try { MASTER = JSON.parse(cachedBackup) || MASTER; } catch(e) {}
      }
      initAllMasterViews();
      showMessage('Koneksi server tertunda. Menggunakan data tersimpan di perangkat.', false);
    });
};

function initAllMasterViews() {
  populateSektor();
  populatePIC();
  populateKegiatan();
  populateSatuanKegiatan();
  renderTKH();
  tambahBahan();
  loadToday();
  updateSyncStatus();
}

function field(obj, names) {
  for (let i = 0; i < names.length; i++) {
    if (obj && obj[names[i]] !== undefined && obj[names[i]] !== null && obj[names[i]] !== '') {
      return obj[names[i]];
    }
  }
  return '';
}

function populateSektor() {
  const select = document.getElementById('sektor');
  select.innerHTML = '<option value="">-- Pilih Sektor --</option>';
  const list = (MASTER.sektor && MASTER.sektor.length) ? MASTER.sektor : [
    { 'ID Sektor': 'S001', 'Sektor': 'Sektor 1' },
    { 'ID Sektor': 'S002', 'Sektor': 'Sektor 2' }
  ];
  list.forEach(function(item) {
    const id = field(item, ['ID Sektor','ID','Id']);
    const nama = field(item, ['Sektor','Nama Sektor','Nama']);
    if (!nama) return;
    const opt = document.createElement('option');
    opt.value = id || nama;
    opt.textContent = nama;
    opt.dataset.nama = nama;
    select.appendChild(opt);
  });
}

function populatePIC() {
  const select = document.getElementById('pic');
  select.innerHTML = '<option value="">-- Pilih PIC / Mandor --</option>';
  const list = (MASTER.pic && MASTER.pic.length) ? MASTER.pic : [
    { 'ID PIC': 'PIC001', 'Nama PIC': 'Wahyuni' },
    { 'ID PIC': 'PIC002', 'Nama PIC': 'Aroka' },
    { 'ID PIC': 'PIC003', 'Nama PIC': 'Suparso' }
  ];
  list.forEach(function(item) {
    const status = field(item, ['Status','status']);
    if (status && status.toLowerCase() !== 'aktif') return;
    const id = field(item, ['ID PIC','ID','Id']);
    const nama = field(item, ['Nama PIC','Nama','PIC']);
    if (!nama) return;
    const opt = document.createElement('option');
    opt.value = id || nama;
    opt.textContent = nama;
    opt.dataset.nama = nama;
    select.appendChild(opt);
  });
}

function populateKegiatan() {
  const select = document.getElementById('kegiatan');
  select.innerHTML = '<option value="">-- Pilih Kegiatan --</option>';
  (MASTER.kegiatan || []).forEach(function(item) {
    const id = field(item, ['ID Kegiatan','ID','Id']);
    const nama = field(item, ['Jenis Kegiatan','Nama Kegiatan','Nama']);
    const satuan = field(item, ['Satuan','Satuan Prestasi']);
    if (!nama) return;
    const opt = document.createElement('option');
    opt.value = id || nama;
    opt.textContent = nama;
    opt.dataset.nama = nama;
    opt.dataset.satuan = satuan;
    select.appendChild(opt);
  });

  const optLain = document.createElement('option');
  optLain.value = '__LAIN__';
  optLain.textContent = 'Pilihan Lain';
  select.appendChild(optLain);
}

function getUniqueSatuanKegiatanList() {
  const set = new Set();
  DEFAULT_SATUAN_KEGIATAN.forEach(function(s) { set.add(s); });
  (MASTER.satuan || []).forEach(function(item) {
    const s = field(item, ['Satuan','Nama Satuan','Nama']);
    if (s) set.add(String(s).trim());
  });
  (MASTER.kegiatan || []).forEach(function(item) {
    const s = field(item, ['Satuan','Satuan Prestasi']);
    if (s) set.add(String(s).trim());
  });
  return Array.from(set);
}

function populateSatuanKegiatan() {
  const selectPekerjaan = document.getElementById('satuanPekerjaan');
  const selectLain = document.getElementById('satuanKegiatanLain');

  selectPekerjaan.innerHTML = '<option value="">-- Pilih Satuan --</option>';
  selectLain.innerHTML = '<option value="">-- Pilih Satuan --</option>';

  const list = getUniqueSatuanKegiatanList();
  list.forEach(function(satuan) {
    const opt1 = document.createElement('option');
    opt1.value = satuan;
    opt1.textContent = satuan;
    selectPekerjaan.appendChild(opt1);

    const opt2 = document.createElement('option');
    opt2.value = satuan;
    opt2.textContent = satuan;
    selectLain.appendChild(opt2);
  });
}

function kegiatanChanged() {
  const select = document.getElementById('kegiatan');
  const boxLain = document.getElementById('kegiatanLainBox');
  const satuanSelect = document.getElementById('satuanPekerjaan');

  if (select.value === '__LAIN__') {
    boxLain.classList.remove('hidden');
    satuanSelect.disabled = false;
    satuanSelect.value = document.getElementById('satuanKegiatanLain').value || '';
  } else {
    boxLain.classList.add('hidden');
    const selectedOption = select.options[select.selectedIndex];
    const defaultSatuan = selectedOption ? (selectedOption.dataset.satuan || '').trim() : '';

    if (defaultSatuan) {
      let match = Array.from(satuanSelect.options).some(function(o) { return o.value === defaultSatuan; });
      if (!match) {
        const newOpt = document.createElement('option');
        newOpt.value = defaultSatuan;
        newOpt.textContent = defaultSatuan;
        satuanSelect.appendChild(newOpt);
      }
      satuanSelect.value = defaultSatuan;
    } else {
      satuanSelect.value = '';
    }
  }
  hitungTotalPrestasi();
}

function satuanLainChanged() {
  if (document.getElementById('kegiatan').value === '__LAIN__') {
    const val = document.getElementById('satuanKegiatanLain').value || '';
    document.getElementById('satuanPekerjaan').value = val;
    hitungTotalPrestasi();
  }
}

function renderTKH() {
  const panel = document.getElementById('tkhDropdownPanel');
  panel.innerHTML = '';

  if (!MASTER.tkhs || MASTER.tkhs.length === 0) {
    panel.innerHTML = '<div class="info">Belum ada data TKH. Buka aplikasi saat online sekali untuk sinkron master.</div>';
    document.getElementById('tkhDropdownLabel').textContent = 'Belum ada data TKH';
    return;
  }

  const actions = document.createElement('div');
  actions.className = 'tkh-dropdown-actions';
  actions.innerHTML = '<button type="button" onclick="setAllTKH(true)">Pilih Semua</button><button type="button" onclick="setAllTKH(false)">Hapus Pilihan</button>';
  panel.appendChild(actions);

  MASTER.tkhs.forEach(function(item, index) {
    const id = field(item, ['ID TKH','ID','Id']);
    const nama = field(item, ['Nama TKH','Nama']);
    const pw = field(item, ['P/W','PW','Gender']) || '-';
    if (!nama) return;

    const row = document.createElement('div');
    row.className = 'tkh-select-row';
    row.innerHTML = `
      <label class="tkh-check">
        <input type="checkbox" class="tkh-checkbox"
               data-index="${index}"
               data-id="${escapeHtml(id || nama)}"
               data-nama="${escapeHtml(nama)}"
               data-pw="${escapeHtml(pw)}"
               onchange="tkhSelectionChanged()">
        <span class="tkh-name">${escapeHtml(nama)}</span>
        <span class="tkh-pw">${escapeHtml(pw)}</span>
      </label>
    `;
    panel.appendChild(row);
  });

  updateTKHDropdownLabel();
  renderSelectedTKH();
}

function toggleTKHDropdown() {
  const panel = document.getElementById('tkhDropdownPanel');
  const button = document.getElementById('tkhDropdownButton');
  const isOpen = panel.classList.toggle('open');
  button.setAttribute('aria-expanded', String(isOpen));
}

function setAllTKH(checked) {
  document.querySelectorAll('.tkh-checkbox').forEach(function(cb) { cb.checked = checked; });
  tkhSelectionChanged();
}

function updateTKHDropdownLabel() {
  const selected = getSelectedTKH();
  const label = document.getElementById('tkhDropdownLabel');
  if (!label) return;
  if (selected.length === 0) label.textContent = 'Pilih nama TKH';
  else if (selected.length <= 2) label.textContent = selected.map(function(x) { return x.nama; }).join(', ');
  else label.textContent = selected.length + ' TKH dipilih';
}

function escapeHtml(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function getSelectedTKH() {
  return Array.from(document.querySelectorAll('.tkh-checkbox:checked')).map(function(cb) {
    return {
      id: cb.dataset.id,
      nama: cb.dataset.nama,
      pw: cb.dataset.pw || '-'
    };
  });
}

function tkhSelectionChanged() {
  updateTKHDropdownLabel();
  renderSelectedTKH();
}

function renderSelectedTKH() {
  const old = document.getElementById('selectedTKHContainer');
  if (old) old.remove();

  const selected = getSelectedTKH();
  const container = document.getElementById('tkhContainer');
  const detail = document.createElement('div');
  detail.id = 'selectedTKHContainer';

  if (selected.length === 0) {
    const info = document.createElement('div');
    info.className = 'info';
    info.textContent = 'Belum ada TKH yang dipilih.';
    detail.appendChild(info);
    container.appendChild(detail);
    hitungTotalPrestasi();
    return;
  }

  const title = document.createElement('div');
  title.className = 'selected-title';
  title.textContent = 'Rincian Prestasi TKH Terpilih:';
  detail.appendChild(title);

  selected.forEach(function(tkh, index) {
    const card = document.createElement('div');
    card.className = 'card tkh-prestasi-card';
    card.innerHTML = `
      <div class="tkh-detail-head">
        <div>
          <div class="card-title">${escapeHtml(tkh.nama)}</div>
          <div class="small">P/W: ${escapeHtml(tkh.pw)}</div>
        </div>
        <div class="tkh-number">#${index + 1}</div>
      </div>
      <label>Prestasi</label>
      <input type="number" step="any" min="0" class="prestasi-input"
             data-id="${escapeHtml(tkh.id)}"
             placeholder="Capaian hasil kerja"
             oninput="hitungTotalPrestasi()">
      <label>Keterangan TKH <span class="optional">(opsional)</span></label>
      <textarea class="keterangan-tkh-input"
                data-id="${escapeHtml(tkh.id)}"
                placeholder="Catatan individu (opsional)"></textarea>
    `;
    detail.appendChild(card);
  });

  container.appendChild(detail);
  hitungTotalPrestasi();
}

function hitungTotalPrestasi() {
  const box = document.getElementById('totalPrestasiBox');
  if (!box) return;

  const inputs = document.querySelectorAll('.prestasi-input');
  let total = 0;
  let count = 0;
  const satuan = document.getElementById('satuanPekerjaan').value || '';

  inputs.forEach(function(input) {
    const val = parseFloat(input.value);
    if (!isNaN(val)) {
      total += val;
      count++;
    }
  });

  if (count === 0) {
    box.classList.add('hidden');
    return;
  }

  box.innerHTML = '<strong>Total Prestasi:</strong> ' +
                  total.toLocaleString('id-ID', { maximumFractionDigits: 4 }) +
                  (satuan ? ' ' + escapeHtml(satuan) : '') +
                  '<div class="small">Diisi oleh ' + count + ' pekerja</div>';
  box.classList.remove('hidden');
}

function getTKHList() {
  const selected = getSelectedTKH();
  if (selected.length === 0) throw new Error('Pilih minimal satu nama TKH.');

  const jamMulai = document.getElementById('jamAwal').value;
  const jamSelesai = document.getElementById('jamAkhir').value;
  const blok = document.getElementById('blokPekerjaan').value.trim();
  const satuan = document.getElementById('satuanPekerjaan').value;

  if (!jamMulai || !jamSelesai) throw new Error('Jam mulai dan jam selesai wajib diisi.');
  if (jamSelesai <= jamMulai) throw new Error('Jam selesai harus lebih besar dari jam mulai.');
  if (!blok) throw new Error('Kolom Blok wajib diisi.');
  if (!satuan) throw new Error('Satuan pekerjaan belum dipilih.');

  const prestasiInputs = document.querySelectorAll('.prestasi-input');
  const keteranganInputs = document.querySelectorAll('.keterangan-tkh-input');
  const list = [];

  selected.forEach(function(tkh) {
    const prestasiInput = Array.from(prestasiInputs).find(function(el) { return el.dataset.id === tkh.id; });
    const keteranganInput = Array.from(keteranganInputs).find(function(el) { return el.dataset.id === tkh.id; });

    if (!prestasiInput || prestasiInput.value === '') {
      throw new Error('Prestasi untuk ' + tkh.nama + ' belum diisi.');
    }

    const val = parseFloat(prestasiInput.value);
    if (isNaN(val) || val < 0) {
      throw new Error('Prestasi untuk ' + tkh.nama + ' harus berupa angka valid.');
    }

    list.push({
      tkh: tkh,
      idTKH: tkh.id,
      namaTKH: tkh.nama,
      pw: tkh.pw, // Mengunci nilai P/W agar tidak NaN di sheet DETAIL_TKH
      jamMulai: jamMulai,
      jamSelesai: jamSelesai,
      blok: blok,
      prestasi: val,
      satuan: satuan,
      keterangan: keteranganInput ? keteranganInput.value.trim() : ''
    });
  });

  return list;
}

// ----------------- FORM PEMAKAIAN BAHAN -----------------
function tambahBahan() {
  const idx = bahanRows.length;
  bahanRows.push({ index: idx });
  renderBahan();
}

function hapusBahan(idx) {
  bahanRows.splice(idx, 1);
  renderBahan();
}

function renderBahan() {
  const container = document.getElementById('bahanContainer');
  container.innerHTML = '';

  bahanRows.forEach(function(row, index) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-title">Bahan #${index + 1}</div>
      <label>Nama Bahan</label>
      <select id="bahan_${index}" onchange="bahanChanged(${index})">
        <option value="">-- Pilih Bahan --</option>
      </select>

      <div id="bahanLainBox_${index}" class="hidden">
        <label>Nama Bahan Lain</label>
        <input type="text" id="bahanLain_${index}" placeholder="Nama bahan baru">
        <label>Satuan Bahan</label>
        <select id="satuanBahanLain_${index}">
          <option value="">-- Pilih Satuan Bahan --</option>
        </select>
      </div>

      <div class="row">
        <div>
          <label>Jumlah</label>
          <input type="number" step="any" min="0" id="jumlahBahan_${index}" placeholder="Contoh: 1, 2.5">
        </div>
        <div>
          <label>Satuan</label>
          <input type="text" id="satuanBahan_${index}" readonly placeholder="Otomatis">
        </div>
      </div>

      <label>Keterangan Bahan <span class="optional">(opsional)</span></label>
      <textarea id="keteranganBahan_${index}" placeholder="Catatan pemakaian"></textarea>

      <button class="btn btn-delete" onclick="hapusBahan(${index})">Hapus Bahan</button>
    `;
    container.appendChild(card);
    populateBahanSelect(index);
    populateSatuanBahanLain(index);
  });
}

function populateBahanSelect(index) {
  const select = document.getElementById('bahan_' + index);
  (MASTER.bahan || []).forEach(function(item) {
    const id = field(item, ['ID Bahan','ID','Id']);
    const nama = field(item, ['Nama Bahan','Bahan','Nama']);
    const satuan = field(item, ['Satuan']);
    if (!nama) return;
    const opt = document.createElement('option');
    opt.value = id || nama;
    opt.textContent = nama;
    opt.dataset.nama = nama;
    opt.dataset.satuan = satuan;
    select.appendChild(opt);
  });

  const optLain = document.createElement('option');
  optLain.value = '__LAIN__';
  optLain.textContent = 'Pilihan Lain';
  select.appendChild(optLain);
}

function populateSatuanBahanLain(index) {
  const select = document.getElementById('satuanBahanLain_' + index);
  if (!select) return;
  select.innerHTML = '<option value="">-- Pilih Satuan Bahan --</option>';
  DEFAULT_SATUAN_BAHAN.forEach(function(s) {
    const opt = document.createElement('option');
    opt.value = s;
    opt.textContent = s;
    select.appendChild(opt);
  });
}

function bahanChanged(index) {
  const select = document.getElementById('bahan_' + index);
  const selectedOption = select.options[select.selectedIndex];
  const boxLain = document.getElementById('bahanLainBox_' + index);
  const satuanInput = document.getElementById('satuanBahan_' + index);

  if (!selectedOption || !selectedOption.value) {
    satuanInput.value = '';
    boxLain.classList.add('hidden');
    return;
  }

  if (selectedOption.value === '__LAIN__') {
    boxLain.classList.remove('hidden');
    satuanInput.value = '';
    const selLain = document.getElementById('satuanBahanLain_' + index);
    selLain.onchange = function() { satuanInput.value = selLain.value; };
  } else {
    boxLain.classList.add('hidden');
    satuanInput.value = selectedOption.dataset.satuan || '';
  }
}

function getBahanList() {
  const list = [];
  bahanRows.forEach(function(row, index) {
    const select = document.getElementById('bahan_' + index);
    if (!select || !select.value) return;
    const opt = select.options[select.selectedIndex];
    let id, nama, satuan;

    if (select.value === '__LAIN__') {
      nama = document.getElementById('bahanLain_' + index).value.trim();
      satuan = document.getElementById('satuanBahanLain_' + index).value;
      id = 'LAIN-BH-' + Date.now() + '-' + index;
      if (!nama) throw new Error('Nama bahan baru #' + (index + 1) + ' wajib diisi.');
      if (!satuan) throw new Error('Satuan bahan baru #' + (index + 1) + ' wajib dipilih.');
    } else {
      id = select.value;
      nama = opt.dataset.nama;
      satuan = opt.dataset.satuan || '';
    }

    const jumlah = document.getElementById('jumlahBahan_' + index).value;
    if (jumlah === '' || isNaN(parseFloat(jumlah))) {
      throw new Error('Jumlah bahan #' + (index + 1) + ' belum diisi dengan benar.');
    }

    list.push({
      bahan: { id: id, nama: nama, satuan: satuan },
      idBahan: id,
      namaBahan: nama,
      satuan: satuan,
      jumlah: parseFloat(jumlah),
      keterangan: document.getElementById('keteranganBahan_' + index).value.trim()
    });
  });
  return list;
}

// ----------------- SUBMIT & OFFLINE QUEUE -----------------
function getKegiatanData() {
  const select = document.getElementById('kegiatan');
  const opt = select.options[select.selectedIndex];
  if (!select.value) throw new Error('Jenis kegiatan belum dipilih.');

  if (select.value === '__LAIN__') {
    const nama = document.getElementById('kegiatanLain').value.trim();
    const satuan = document.getElementById('satuanKegiatanLain').value;
    if (!nama) throw new Error('Nama kegiatan lain belum diisi.');
    if (!satuan) throw new Error('Satuan kegiatan lain belum dipilih.');
    return {
      id: 'LAIN-' + Date.now(),
      nama: nama,
      satuan: document.getElementById('satuanPekerjaan').value || satuan
    };
  }

  return {
    id: select.value,
    nama: opt.dataset.nama,
    satuan: document.getElementById('satuanPekerjaan').value || opt.dataset.satuan || ''
  };
}

function getSektorData() {
  const select = document.getElementById('sektor');
  const opt = select.options[select.selectedIndex];
  if (!select.value) throw new Error('Sektor belum dipilih.');
  return { id: select.value, nama: opt.dataset.nama || opt.textContent };
}

function getPICData() {
  const select = document.getElementById('pic');
  const opt = select.options[select.selectedIndex];
  if (!select.value) throw new Error('PIC / Mandor belum dipilih.');
  return { id: select.value, nama: opt.dataset.nama || opt.textContent };
}

function simpanSemua() {
  const btn = document.querySelector('.btn-save');
  btn.disabled = true;
  btn.textContent = 'MENYIMPAN...';
  clearMessage();

  try {
    const tanggal = document.getElementById('tanggal').value;
    if (!tanggal) throw new Error('Tanggal kegiatan belum ditentukan.');

    const payload = {
      clientTransactionId: 'TKH-' + Date.now() + '-' + Math.random().toString(36).substring(2, 9),
      tanggal: tanggal,
      sektor: getSektorData(),
      pic: getPICData(),
      kegiatan: getKegiatanData(),
      keterangan: document.getElementById('keteranganKegiatan').value.trim(),
      tkhList: getTKHList(),
      bahanList: getBahanList()
    };

    addToOfflineQueue(payload);
    resetForm();
    btn.disabled = false;
    btn.textContent = 'SIMPAN KEGIATAN';

    if (navigator.onLine) {
      showMessage('Data tersimpan di antrean perangkat. Mengirim ke spreadsheet...', false);
      syncQueueSequentially();
    } else {
      showMessage('Data tersimpan di perangkat (Offline). Akan disinkronkan saat terhubung internet.', false);
    }
    updateSyncStatus();
    loadToday();
  } catch (err) {
    btn.disabled = false;
    btn.textContent = 'SIMPAN KEGIATAN';
    showMessage(err.message, true);
  }
}

const OFFLINE_QUEUE_KEY = 'TKH_KEBUN_V2_OFFLINE_QUEUE';
const OFFLINE_MASTER_KEY = 'TKH_KEBUN_V2_MASTER_CACHE';
let syncRunning = false;

function getOfflineQueue() {
  try { return JSON.parse(localStorage.getItem(OFFLINE_QUEUE_KEY) || '[]'); } catch(e) { return []; }
}
function setOfflineQueue(q) { localStorage.setItem(OFFLINE_QUEUE_KEY, JSON.stringify(q)); }
function addToOfflineQueue(data) {
  const q = getOfflineQueue(); q.push(data); setOfflineQueue(q);
}

function updateSyncStatus() {
  const el = document.getElementById('syncBar');
  if (!el) return;
  const count = getOfflineQueue().length;
  el.className = 'sync-bar ' + (navigator.onLine ? '' : 'offline-note');
  el.innerHTML = navigator.onLine
    ? '<strong>Online</strong> · ' + count + ' data dalam antrean kirim.' + (count ? ' <div class="sync-actions"><button onclick="syncQueueSequentially()">SINKRON SEKARANG</button></div>' : '')
    : '<strong>Mode Offline</strong> · Internet tidak aktif. ' + count + ' data tersimpan di HP.';
}

function syncQueueSequentially() {
  if (syncRunning || !navigator.onLine || !getOfflineQueue().length) {
    updateSyncStatus();
    return;
  }
  syncRunning = true;
  updateSyncStatus();

  const q = getOfflineQueue();
  const currentItem = q[0];

  backendCall('saveFullActivity', currentItem)
    .then(function(res) {
      if (res && res.success) {
        const latest = getOfflineQueue();
        latest.shift();
        setOfflineQueue(latest);
        syncRunning = false;

        if (latest.length) {
          syncQueueSequentially();
        } else {
          updateSyncStatus();
          showMessage('Semua data berhasil disinkronkan ke server Google Sheets.', false);
          loadToday();
        }
      } else {
        syncRunning = false;
        updateSyncStatus();
        showMessage((res && res.message) ? res.message : 'Sinkronisasi tertunda.', true);
      }
    })
    .catch(function(err) {
      syncRunning = false;
      updateSyncStatus();
      showMessage('Gagal sinkronisasi data: ' + err.message, true);
    });
}

function setupOfflineSync() {
  window.addEventListener('online', function() { updateSyncStatus(); syncQueueSequentially(); loadToday(); });
  window.addEventListener('offline', function() { updateSyncStatus(); loadToday(); });
  updateSyncStatus();
}

function resetForm() {
  document.getElementById('sektor').value = '';
  document.getElementById('pic').value = '';
  document.getElementById('kegiatan').value = '';
  document.getElementById('kegiatanLain').value = '';
  document.getElementById('kegiatanLainBox').classList.add('hidden');
  document.getElementById('satuanKegiatanLain').value = '';
  document.getElementById('satuanPekerjaan').value = '';
  document.getElementById('blokPekerjaan').value = '';
  document.getElementById('keteranganKegiatan').value = '';
  document.getElementById('totalPrestasiBox').classList.add('hidden');

  bahanRows = [];
  renderTKH();
  tambahBahan();
}

function loadToday() {
  const tanggal = document.getElementById('tanggal').value;
  if (!tanggal) return;

  if (!navigator.onLine) {
    renderLocalToday(tanggal);
    return;
  }

  document.getElementById('todayList').innerHTML = '<div class="loading">Memuat...</div>';
  backendCall('getAktivitasByDate', tanggal)
    .then(function(data) {
      renderToday(data);
      renderLocalToday(tanggal, true);
    })
    .catch(function() {
      renderLocalToday(tanggal);
    });
}

function renderLocalToday(tanggal, keepServer) {
  const queue = getOfflineQueue().filter(function(item) { return item.tanggal === tanggal; });
  if (!queue.length) {
    if (!keepServer) document.getElementById('todayList').innerHTML = '<div class="small">Belum ada kegiatan hari ini.</div>';
    return;
  }
  let html = '<div class="pending-note info"><strong>Antrean Lokal:</strong> ' + queue.length + ' kegiatan belum terunggah ke Google Sheets.</div>';
  queue.forEach(function(item) {
    html += '<div class="activity-item"><div class="activity-name">' + escapeHtml(item.kegiatan.nama || '-') + '</div>';
    html += '<div class="small">' + escapeHtml(item.sektor.nama || '-') + ' · Mandor: ' + escapeHtml(item.pic.nama || '-') + ' · [MENUNGGU SINKRON]</div></div>';
  });
  const el = document.getElementById('todayList');
  el.innerHTML = (keepServer ? el.innerHTML : '') + html;
}

function renderToday(data) {
  const container = document.getElementById('todayList');
  if (!data || !data.kegiatan || data.kegiatan.length === 0) {
    container.innerHTML = '<div class="small">Belum ada kegiatan pada tanggal ini.</div>';
    return;
  }

  let html = '';
  data.kegiatan.forEach(function(kg) {
    const id = kg['ID Kegiatan Harian'];
    const nama = kg['Jenis Kegiatan'] || '-';
    const pic = kg['Nama PIC'] || '-';
    const sektor = kg['Sektor'] || '-';

    html += '<div class="activity-item">';
    html += '<div class="activity-name">' + escapeHtml(nama) + '</div>';
    html += '<div class="small">' + escapeHtml(sektor) + ' · Mandor: ' + escapeHtml(pic) + '</div>';

    const details = (data.detailTKH || []).filter(function(row) {
      return row['ID Kegiatan Harian'] === id;
    });

    details.forEach(function(row) {
      html += '<div class="small">• ' + escapeHtml(row['Nama TKH']) + ' (' + escapeHtml(row['P/W'] || '-') + ') : ' +
              escapeHtml(row['Prestasi']) + ' ' + escapeHtml(row['Satuan']) +
              ' [Blok ' + escapeHtml(row['Blok']) + ' | ' + escapeHtml(row['Jam Mulai']) + '–' + escapeHtml(row['Jam Selesai']) + ']</div>';
    });

    const bahans = (data.bahan || []).filter(function(row) {
      return row['ID Kegiatan Harian'] === id;
    });

    bahans.forEach(function(row) {
      html += '<div class="small">📦 Bahan: ' + escapeHtml(row['Nama Bahan']) + ' ' + escapeHtml(row['Jumlah']) + ' ' + escapeHtml(row['Satuan']) + '</div>';
    });

    html += '</div>';
  });

  container.innerHTML = html;
}

function showMessage(msg, isErr) {
  const box = document.getElementById('message');
  box.className = isErr ? 'error' : 'success';
  box.textContent = msg;
}

function clearMessage() {
  const box = document.getElementById('message');
  box.className = '';
  box.textContent = '';
}
