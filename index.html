<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TKH Kebun V3</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: #f0f4f3; color: #243238; }
    .app { max-width: 520px; margin: auto; background: #ffffff; min-height: 100vh; padding-bottom: 30px; }
    
    .header { background: #164f45; color: white; padding: 20px; border-bottom-left-radius: 12px; border-bottom-right-radius: 12px; }
    .header .company { font-size: 12px; opacity: 0.9; text-transform: uppercase; }
    .header h1 { margin-top: 4px; font-size: 24px; }

    .sync-bar { margin: 12px; padding: 10px 14px; border-radius: 10px; background: #e5f5e9; color: #23633b; font-size: 13px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
    .sync-bar.offline { background: #fff4d8; color: #795b00; }

    .step-card { margin: 12px; padding: 16px; border: 1px solid #dce4e2; border-radius: 14px; background: #ffffff; }
    .step-title { font-size: 18px; font-weight: bold; color: #164f45; margin-bottom: 14px; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; }
    
    label { display: block; margin-top: 12px; margin-bottom: 4px; font-weight: bold; font-size: 14px; color: #526066; }
    input, select, textarea { width: 100%; padding: 12px; border: 1px solid #cbd5d2; border-radius: 8px; font-size: 15px; background: white; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .btn { border: none; border-radius: 10px; padding: 14px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 12px; }
    .btn-primary { background: #164f45; color: white; }
    .btn-secondary { background: #e4f1ee; color: #164f45; }
    .btn-danger { background: #f9e2e2; color: #b52e2e; padding: 8px 12px; font-size: 12px; width: auto; }
    .btn-row { display: flex; gap: 10px; margin-top: 16px; }

    .item-card { border: 1px solid #dce4e2; border-radius: 10px; padding: 12px; margin-top: 10px; background: #fafcfb; }
    .summary-box { background: #edf5f3; padding: 12px; border-radius: 10px; margin-top: 12px; font-size: 14px; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="company">PT INDOARABICA MANGKURAJA</div>
    <h1>TKH Kebun V3</h1>
  </div>

  <div id="syncBar" class="sync-bar">
    <span id="syncText">● Online (Koneksi Langsung V3.2)</span>
    <span id="queueBadge">0 antrean</span>
  </div>

  <!-- STEP 1: INFORMASI HARIAN -->
  <div id="step1" class="step-card">
    <div class="step-title">1. Form Informasi Harian</div>
    <label>Tanggal</label>
    <input type="date" id="tanggal">

    <label>Sektor</label>
    <select id="sektor">
      <option value="">-- Pilih Sektor --</option>
      <option value="S001">Sektor 1</option>
      <option value="S002">Sektor 2</option>
    </select>

    <label>PIC / Mandor</label>
    <select id="pic">
      <option value="">-- Pilih PIC / Mandor --</option>
      <option value="PIC001">Wahyuni</option>
      <option value="PIC002">Aroka</option>
      <option value="PIC003">Suparso</option>
    </select>

    <button type="button" class="btn btn-primary" onclick="goToStep(2)">+ Tambah Kegiatan &gt;</button>
  </div>

  <!-- STEP 2: TAMBAH KEGIATAN & BAHAN -->
  <div id="step2" class="step-card hidden">
    <div class="step-title">2. Form Tambah Kegiatan</div>
    <label>Jenis Kegiatan</label>
    <select id="kegiatan" onchange="kegiatanChanged()">
      <option value="">-- Pilih Kegiatan --</option>
      <option value="1">Pemupukan NPK (TBM)</option>
      <option value="2">Pemupukan Urea (TBM)</option>
      <option value="3">Pemupukan KCL (TBM)</option>
      <option value="4">Pemupukan NPK (TM)</option>
      <option value="5">Pemupukan Urea (TM)</option>
      <option value="6">Pemupukan KCL (TM)</option>
      <option value="7">Pemupukan Kompos / Organik</option>

      <option value="8">Penyemprotan Herbisida (Gulma)</option>
      <option value="9">Penyemprotan Insektisida (Hama)</option>
      <option value="10">Penyemprotan Fungisida (Penyakit)</option>
      <option value="11">Babad / Babat Rumput Manual</option>
      <option value="12">Babat Rumput Mekanis (Mesin)</option>
      <option value="13">Nyiang Kiring / Piringan</option>

      <option value="14">Pangkas Lepas / Bentuk (TBM)</option>
      <option value="15">Pangkas Lepas / Produksi (TM)</option>
      <option value="16">Pangkas Wiwilan / Tunas Air</option>
      <option value="17">Pangkas Lepas Kepala / Toping</option>
      <option value="18">Pangkas Rejuvenasi / Reboisasi</option>

      <option value="19">Panen Petik Merah</option>
      <option value="20">Panen Petik Campur</option>
      <option value="21">Panen Asalan</option>

      <option value="22">Sulam Tanaman Kopi</option>
      <option value="23">Sulam Tanaman Pelindung</option>

      <option value="24">Pembuatan Lubang Tanam</option>
      <option value="25">Pembuatan Rorak / Kebun</option>
      <option value="26">Pembersihan Saluran Air / Drainase</option>
      <option value="27">Perbaikan Jalan Kebun / Teras</option>
      <option value="28">Pembuatan Naungan / Pelindung</option>

      <option value="29">Pengangkutan Hasil Panen</option>
      <option value="30">Pengangkutan Pupuk / Bahan</option>
      <option value="31">Pembersihan Kebun Umum</option>
      <option value="__LAIN__">Pilihan Lain (Tulis Manual)</option>
    </select>

    <div id="kegiatanLainBox" class="hidden">
      <label>Nama Kegiatan Lain</label>
      <input type="text" id="kegiatanLain" placeholder="Tuliskan nama kegiatan">
      <label>Satuan</label>
      <select id="satuanKegiatanLain">
        <option value="">-- Pilih Satuan --</option>
        <option value="Batang">Batang</option>
        <option value="Ha">Ha</option>
        <option value="Kg">Kg</option>
        <option value="Tangki">Tangki</option>
        <option value="Lubang">Lubang</option>
        <option value="Meter">Meter</option>
      </select>
    </div>

    <div style="margin-top: 20px; font-weight: bold; color: #164f45;">Pemakaian Bahan (Opsional)</div>
    <div id="bahanContainer"></div>
    <button type="button" class="btn btn-secondary" onclick="tambahBahan()">+ Tambah Bahan</button>

    <div class="btn-row">
      <button type="button" class="btn btn-secondary" onclick="goToStep(1)">&lt; Kembali</button>
      <button type="button" class="btn btn-primary" onclick="goToStep(3)">Lanjut: Tambah TKH &gt;</button>
    </div>
  </div>

  <!-- STEP 3: TAMBAH TKH -->
  <div id="step3" class="step-card hidden">
    <div class="step-title">3. Form Tambah TKH</div>
    <div id="tkhInputForm" class="item-card">
      <label>Nama TKH</label>
      <select id="selectTKH">
        <option value="">-- Pilih TKH --</option>
        <option value="1707044808881001">Anita</option>
        <option value="1703081312800002">Ari Kristianto</option>
        <option value="1707040606010003">Arjuna Utama</option>
        <option value="1707076002880001">Atita</option>
        <option value="1709032412710001">Asmawi</option>
        <option value="1709032412710002">Budi Santoso</option>
        <option value="1709032412710003">Dedi Kurniawan</option>
        <option value="1709032412710004">Eko Prasetyo</option>
        <option value="1709032412710005">Fitriani</option>
        <option value="1709032412710006">Hendrikus</option>
        <option value="1709032412710007">Iwan Setiawan</option>
        <option value="1709032412710008">Joko Susilo</option>
        <option value="1709032412710009">Kartini</option>
        <option value="1709032412710010">Luki Gunawan</option>
        <option value="1709032412710011">Marlina</option>
        <option value="1709032412710012">Nurdin</option>
        <option value="1709032412710013">Oman Rohman</option>
        <option value="1709032412710014">Putri Rahayu</option>
        <option value="1709032412710015">Rahmat Hidayat</option>
        <option value="1709032412710016">Samsul Bahri</option>
        <option value="1709032412710017">Titin Sumarni</option>
        <option value="1709032412710018">Ujang Supriatna</option>
        <option value="1709032412710019">Yayan Mulyana</option>
        <option value="1709032412710020">Zulkifli</option>
      </select>

      <div class="row">
        <div>
          <label>Jam Mulai</label>
          <input type="time" id="jamMulai" value="07:30">
        </div>
        <div>
          <label>Jam Akhir</label>
          <input type="time" id="jamAkhir" value="11:00">
        </div>
      </div>

      <div class="row">
        <div>
          <label>Blok</label>
          <input type="text" id="blok" placeholder="Contoh: C10">
        </div>
        <div>
          <label>Prestasi</label>
          <input type="number" step="any" id="prestasi" placeholder="Jumlah">
        </div>
      </div>

      <label>Satuan Pekerjaan</label>
      <select id="satuanKerja">
        <option value="Batang">Batang</option>
        <option value="Ha">Ha</option>
        <option value="Kg">Kg</option>
        <option value="Liter">Liter</option>
        <option value="Tangki">Tangki</option>
        <option value="Lubang">Lubang</option>
      </select>

      <button type="button" class="btn btn-secondary" onclick="tambahTKHKeDaftar()">+ Tambah ke Daftar</button>
    </div>

    <div style="margin-top: 16px; font-weight: bold;">Daftar TKH dalam Kegiatan ini:</div>
    <div id="daftarTKHContainer"></div>

    <div id="totalPrestasiBox" class="summary-box hidden">
      <b>Total Prestasi Kegiatan:</b> <span id="totalPrestasiVal">0</span>
    </div>

    <div class="btn-row">
      <button type="button" class="btn btn-secondary" onclick="goToStep(2)">&lt; Kembali</button>
      <button type="button" class="btn btn-primary" onclick="goToStep(4)">Lanjut: Preview &gt;</button>
    </div>
  </div>

  <!-- STEP 4: PREVIEW -->
  <div id="step4" class="step-card hidden">
    <div class="step-title">4. Preview Sebelum Disimpan</div>
    <div id="previewContent"></div>

    <div class="btn-row">
      <button type="button" class="btn btn-secondary" onclick="goToStep(3)">&lt; Kembali</button>
      <button type="button" class="btn btn-primary" style="background:#23633b;" onclick="simpanSemua()">✔ Simpan Kegiatan</button>
    </div>
  </div>

  <!-- STEP 5: SUKSES -->
  <div id="step5" class="step-card hidden" style="text-align: center;">
    <div style="font-size: 48px;">✔</div>
    <div style="font-size: 20px; font-weight: bold; color: #23633b; margin-top: 10px;">Data Kegiatan Berhasil Disimpan!</div>
    <div id="suksesMsg" class="summary-box" style="margin-top: 15px;"></div>

    <button type="button" class="btn btn-primary" onclick="resetApp()">Tambah Kegiatan Lagi</button
